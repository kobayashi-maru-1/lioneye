[package]
name = "exile-leveling-local"
version = "0.4.9"
edition = "2024"

[[bin]]
name = "exile-leveling"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4.6", features = ["derive"] }
# PoB's Inflate (timeless jewel data); already used by zip.
flate2 = "1"
mime_guess = "2"
# Path of Building's calculations (src/pob.rs): LuaJIT built from source, and the bundled PoB archive.
mlua = { version = "0.10", features = ["luajit", "vendored"] }
regex = "1.12"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Tray icon, error message box and console attach (the exe has no console window on Windows),
# and the in-game bar: a WebView2 window (wry) on a window of our own (raw-window-handle).
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
tray-icon = "0.26"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
wry = { version = "0.57", default-features = false }

[profile.release]
strip = true
lto = true
codegen-units = 1
