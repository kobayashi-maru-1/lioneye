[package]
name = "exile-leveling-local"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "exile-leveling"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4.6", features = ["derive"] }
mime_guess = "2"
# Path of Building's calculations (src/pob.rs): LuaJIT built from source, and the bundled PoB archive.
mlua = { version = "0.10", features = ["luajit", "vendored"] }
regex = "1.12"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
sysinfo = "0.39"
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Tray icon, error message box and console attach (the exe has no console window on Windows).
[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
