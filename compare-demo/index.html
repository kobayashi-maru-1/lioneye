<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Lioneye Compare Concept</title>
<style>
/* Lioneye's guide look: near-black page, a pinned jump bar of gold small caps, and
   foldable black panels whose gold headers pin under it. Single dark theme on purpose. */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
:root {
  color-scheme: dark;
  --primary: #161616;
  --panel: #111111;
  --panel-2: #1a1a1a;
  --border: #2a2a2a;
  --navy: #171e2a;
  --navy-border: #2f3b4d;
  --navy-deep: #12171f;
  --fg: #c8c8c8;
  --fg-strong: #e8e8e8;
  --muted: #8b8b8b;
  --gold: #af8040;
  --gold-hover: #c99550;
  --gold-soft: rgba(175, 128, 64, 0.16);
  --good: #79c27d;
  --bad: #e0716b;
  --warn: #dfab4a;
  --k-gear: #8fb0dc;
  --k-tree: #86c08a;
  --k-gems: #d6ad66;
  --k-links: #e0a0c8;
  --k-config: #b8b8b8;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  --radius: 6px;
  --jumpbar: 2.25rem;
  --panel-head: 2.75rem;
}
html { scroll-padding-top: calc(var(--jumpbar) + 8px); }
body { margin: 0; background: var(--primary); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.5; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.pos { color: var(--good); }
.neg { color: var(--bad); }
.zero { color: var(--muted); }

/* Jump bar: the app's only bar, pinned at the top. */
.jumpbar {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: stretch; overflow-x: auto; scrollbar-width: none;
  height: var(--jumpbar);
  padding: 0 max(8px, env(safe-area-inset-left, 0px));
  background: var(--primary); border-bottom: 1px solid var(--border);
}
.jumpbar::-webkit-scrollbar { display: none; }
.jumpbar .inner { display: flex; align-items: stretch; width: 100%; max-width: 1100px; margin: 0 auto; }
.jump {
  display: flex; align-items: center; flex: none; padding: 0 10px;
  color: var(--gold); font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em;
  white-space: nowrap; border-bottom: 2px solid transparent;
}
.jump:hover { color: var(--gold-hover); }
.jump[aria-current="true"] { border-bottom-color: var(--gold); }
.jumpbar .flag { margin-left: auto; display: flex; align-items: center; padding-left: 12px; }

.page {
  max-width: 1100px; margin: 0 auto;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px));
  display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr);
}

/* Chips and small controls */
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; border: 1px solid var(--border); border-radius: 999px; font-size: 12px; color: var(--muted); white-space: nowrap; line-height: 20px; }
.chip.warn { color: var(--warn); border-color: rgba(223, 171, 74, 0.45); }
.chip.good { color: var(--good); border-color: rgba(121, 194, 125, 0.4); }
.chip.gold { color: var(--gold); border-color: rgba(175, 128, 64, 0.5); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
.seg button { padding: 1px 10px; font-size: 13px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--gold-soft); color: var(--gold); }
.seg button:focus-visible { outline-offset: -2px; }
.btn { border: 1px solid var(--border); border-radius: 4px; padding: 0 8px; font-size: 12px; line-height: 22px; color: var(--fg); white-space: nowrap; }
.btn:hover, .btn[aria-expanded="true"] { border-color: var(--gold); color: var(--gold); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--border); border-radius: 999px; padding: 1px 11px; font-size: 13px; color: var(--muted); }
.chips button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); background: var(--gold-soft); }
.search { flex: 1 1 200px; min-width: 0; background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px; padding: 4px 9px; }
.search::placeholder { color: var(--muted); }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.check input { accent-color: var(--gold); }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }

/* Builds card (not foldable) */
.builds { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px 12px; display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
.builds .title { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.builds h1 { margin: 0; font-size: 0.8rem; color: var(--gold); text-transform: uppercase; letter-spacing: 0.02em; font-weight: 600; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 600px) { .pair { grid-template-columns: minmax(0, 1fr); } }
.build { background: var(--navy); border: 1px solid var(--navy-border); border-radius: var(--radius); padding: 8px 10px; display: grid; gap: 2px; min-width: 0; }
.build .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; display: flex; align-items: center; gap: 6px; }
.build .row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.build .name { color: var(--fg-strong); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.build select { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--navy-border); border-radius: 4px; padding: 2px 6px; color: var(--fg-strong); font-weight: 600; }
.build .sub { font-size: 12px; color: var(--muted); }
.live { color: var(--good); border: 1px solid rgba(121, 194, 125, 0.45); border-radius: 3px; padding: 0 4px; font-size: 10px; letter-spacing: 0.06em; }
.footing { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 6px 10px; border: 1px dashed var(--border); border-radius: var(--radius); background: var(--panel-2); }
.footing .f { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.footing .k { font-size: 12px; color: var(--muted); }
.footing .v { color: var(--fg-strong); }

/* Foldable panel (PageSection) */
.section { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 0 12px 4px; min-width: 0; scroll-margin-top: calc(var(--jumpbar) + 8px); }
.section > .head {
  position: sticky; top: var(--jumpbar); z-index: 3;
  display: flex; align-items: center; gap: 10px; height: var(--panel-head);
  margin: 0 -12px; padding: 0 12px; background: var(--panel); border-radius: var(--radius) var(--radius) 0 0; cursor: pointer;
}
.section > .head .toggle { display: flex; align-items: center; gap: 6px; color: var(--gold); font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; }
.section > .head .toggle:hover { color: var(--gold-hover); }
.section > .head .toggle svg { width: 14px; height: 14px; }
.section > .head .actions { margin-left: auto; display: flex; align-items: center; gap: 8px; min-width: 0; }
.section > .body { padding: 2px 0 10px; display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
.section[data-collapsed] > .body { display: none; }

/* Summary tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.tile { text-align: left; background: var(--navy-deep); border: 1px solid var(--navy-border); border-radius: var(--radius); padding: 7px 10px; display: grid; gap: 1px; min-width: 0; }
.tile:hover { border-color: var(--gold); }
.tile .t { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.tile .v { font-size: 20px; color: var(--fg-strong); font-variant-numeric: tabular-nums; line-height: 1.3; }
.tile .g { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; justify-content: space-between; gap: 6px; }

/* Gaps */
.gap-list { display: grid; gap: 6px; grid-template-columns: minmax(0, 1fr); }
.gap-head { color: var(--gold); font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; padding: 6px 0 0; }
.gap { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; align-items: center; gap: 4px 10px; padding: 6px 10px; background: var(--navy-deep); border: 1px solid var(--navy-border); border-radius: var(--radius); }
.gap .kind { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; border: 1px solid currentColor; border-radius: 3px; padding: 0 4px; justify-self: start; }
.gap .kind.Gear { color: var(--k-gear); } .gap .kind.Tree { color: var(--k-tree); } .gap .kind.Gems { color: var(--k-gems); } .gap .kind.Links { color: var(--k-links); } .gap .kind.Config { color: var(--k-config); }
.gap .what { min-width: 0; }
.gap .what b { color: var(--fg-strong); font-weight: 600; }
.gap .what .d { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.gap .pills { grid-column: 2 / 3; display: flex; flex-wrap: wrap; gap: 4px; }
.pill { font-size: 12px; border-radius: 3px; padding: 0 5px; background: rgba(255, 255, 255, 0.04); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill.big { font-size: 14px; font-weight: 600; background: transparent; padding: 0; }
.gap .act { grid-column: 3; grid-row: 1 / span 2; display: flex; gap: 6px; }
@media (max-width: 560px) {
  .gap { grid-template-columns: minmax(0, 1fr) auto; }
  .gap .kind { grid-column: 1 / -1; }
  .gap .pills { grid-column: 1 / -1; }
  .gap .act { grid-column: 2; grid-row: 2; }
}

/* Tables */
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; padding: 5px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 4px 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.04); vertical-align: middle; }
td.r, th.r { text-align: right; white-space: nowrap; }
tr.group td { color: var(--gold); font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; padding-top: 10px; border-bottom: 1px solid var(--border); }
tr.same td { color: var(--muted); }
tr.open td { background: var(--gold-soft); }
.tag { font-size: 10px; border: 1px solid var(--border); color: var(--muted); border-radius: 3px; padding: 0 4px; margin-left: 6px; vertical-align: 1px; letter-spacing: 0.04em; }
.empty { color: var(--muted); padding: 10px 8px; }

/* Why drawer */
td.drawer { padding: 6px 0 10px; background: none; }
.why { border: 1px solid var(--navy-border); background: var(--navy); border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); }
.why .formula { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; font-variant-numeric: tabular-nums; }
.why .formula .who { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; align-self: center; }
.why table td { border-bottom-color: rgba(255, 255, 255, 0.05); }
.why .src { color: var(--fg); }
.why .src small { color: var(--muted); margin-left: 6px; }
.why .k-Gear { color: var(--k-gear); } .why .k-Tree { color: var(--k-tree); } .why .k-Gems { color: var(--k-gems); } .why .k-Config { color: var(--k-config); }

/* Skills */
.groups { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
@media (max-width: 380px) { .groups { grid-template-columns: minmax(0, 1fr); } }
.grp { background: var(--navy-deep); border: 1px solid var(--navy-border); border-radius: var(--radius); padding: 6px 10px 8px; min-width: 0; }
.grp h3 { margin: 0 0 2px; font-size: 13px; color: var(--fg-strong); font-weight: 600; }
.grp .slots { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.grp table td { padding: 2px 6px; }
.grp .miss { color: var(--bad); }
.grp .extra { color: var(--warn); }

/* Items */
.item { background: var(--navy-deep); border: 1px solid var(--navy-border); border-radius: var(--radius); min-width: 0; }
.item > summary { cursor: pointer; list-style: none; display: grid; grid-template-columns: 110px minmax(0, 1fr) minmax(0, 1fr); gap: 4px 10px; padding: 6px 10px; align-items: baseline; }
.item > summary::-webkit-details-marker { display: none; }
.item > summary .slot { color: var(--gold); font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
.item > summary .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item > summary .nm small { color: var(--muted); }
.item .lines { padding: 0 10px 8px; display: grid; gap: 8px; grid-template-columns: 1fr 1fr; }
.item .lines h4 { margin: 0 0 2px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
.item .lines ul { margin: 0; padding: 0; list-style: none; font-size: 13px; }
.item .lines li { padding: 1px 0; overflow-wrap: anywhere; }
.item .rolls { grid-column: 1 / -1; }
.item.flash { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
@media (max-width: 600px) {
  .item > summary { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .item > summary .slot { grid-column: 1 / -1; }
  .item .lines { grid-template-columns: minmax(0, 1fr); }
}
.rare { color: #e6d85f; } .unique { color: #c5874b; } .magic { color: #8888ff; } .normal { color: var(--fg); }

/* Overlay mock */
.scene { position: relative; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); background: radial-gradient(120% 90% at 30% 10%, #2b2a24 0%, #15140f 55%, #0b0b09 100%); min-height: 220px; padding: 14px; display: grid; justify-items: end; align-content: start; }
.ov { width: min(280px, 100%); background: rgba(10, 12, 16, 0.92); border: 1px solid var(--navy-border); border-radius: var(--radius); padding: 8px 10px; display: grid; gap: 6px; font-size: 13px; }
.ov .h { display: flex; align-items: center; gap: 8px; color: var(--gold); font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
.ov .h .sub { color: var(--muted); text-transform: none; letter-spacing: 0; font-weight: 400; margin-left: auto; }
.ov .r { display: flex; justify-content: space-between; gap: 8px; }
.ov .r span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--navy); border: 1px solid var(--gold); color: var(--fg-strong); padding: 6px 14px; border-radius: var(--radius); font-size: 13px; z-index: 10; transition: opacity 0.15s; }
.toast.off { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<nav class="jumpbar" aria-label="Sections"><div class="inner" id="jumps"></div></nav>

<main class="page">
  <section class="builds" aria-labelledby="builds-title">
    <div class="title">
      <h1 id="builds-title">Compare</h1>
      <span class="chip gold">Concept</span>
      <span class="chip" id="pob-chip"></span>
    </div>
    <div class="pair">
      <div class="build">
        <div class="lbl">Build 1 <span class="live">LIVE</span></div>
        <div class="row"><span class="name" id="live-name"></span><button class="btn" data-toast="Refresh">Refresh</button></div>
        <div class="sub" id="live-sub"></div>
      </div>
      <div class="build">
        <div class="lbl">Build 2</div>
        <div class="row"><select id="loadout" aria-label="Loadout"></select></div>
        <div class="sub" id="guide-sub"></div>
      </div>
    </div>
    <div class="footing">
      <div class="f"><span class="k">Skill</span><span class="v" id="skill"></span><span class="chip good">Same</span></div>
      <div class="f"><span class="k">Config</span>
        <div class="seg" role="group" aria-label="Config for Build 1">
          <button type="button" data-mode="guide" aria-pressed="true">Guide</button>
          <button type="button" data-mode="own" aria-pressed="false">Live</button>
        </div>
        <span class="chip warn" id="config-chip"></span>
      </div>
    </div>
  </section>

  <section class="section" id="summary" data-title="Summary"><div class="body">
    <div class="tiles" id="tiles"></div>
  </div></section>

  <section class="section" id="gaps" data-title="Gaps"><div class="body">
    <div class="chips" id="gap-chips" role="group" aria-label="Metric"></div>
    <div class="gap-list" id="gap-list"></div>
  </div></section>

  <section class="section" id="stats" data-title="Stats"><div class="body">
    <div class="tools">
      <input class="search" id="stat-search" type="search" placeholder="Search" aria-label="Search stats">
      <label class="check"><input type="checkbox" id="stat-same"> Show same</label>
    </div>
    <div class="scroll"><table>
      <thead><tr><th>Stat</th><th class="r">Live</th><th class="r">Guide</th><th class="r">Diff</th><th class="r"><span hidden>Sources</span></th></tr></thead>
      <tbody id="stat-body"></tbody>
    </table></div>
  </div></section>

  <section class="section" id="config" data-title="Config"><div class="body" id="config-body"></div></section>
  <section class="section" id="passives" data-title="Passives"><div class="body" id="passive-body"></div></section>
  <section class="section" id="skills" data-title="Skills"><div class="body"><div class="groups" id="skill-body"></div></div></section>
  <section class="section" id="items" data-title="Items"><div class="body" id="item-body"></div></section>

  <section class="section" id="overlay" data-title="Overlay"><div class="body">
    <div class="tools"><div class="chips" id="ov-chips" role="group" aria-label="Overlay metric"></div></div>
    <div class="scene"><div class="ov" id="ov"></div></div>
  </div></section>
</main>

  };
  const metric = Object.fromEntries(D.metrics.map((m) => [m.key, m]));
  const THRESH = { dps: 1000, poison: 1, armour: 50, life: 10, ehp: 200, phys: 50, chaos: 1, move: 1 };
  // Stored choices can outlive a data rebuild: fall back when a key is gone.
  const metricKey = (k, d) => (k === "all" || metric[k] ? k : d);

  const n = (v, digits = 0) => Math.abs(v).toLocaleString("en-US", { maximumFractionDigits: digits, minimumFractionDigits: digits });
  function fmt(key, v) {
    if (v == null || Number.isNaN(v)) return "—";
    const m = metric[key];
    const sign = v < 0 ? MINUS : "";
    if (m?.fmt === "k") return sign + (Math.abs(v) >= 10000 ? n(v / 1000, 1) + "k" : n(v));
    if (m?.fmt === "%") return sign + n(v) + "%";
    return sign + n(v);
  }
  function delta(key, v, exact) {
    if (Math.abs(v) < (exact ? 0.05 : THRESH[key] ?? 0.5)) return `<span class="zero">0</span>`;
    const cls = v > 0 ? "pos" : "neg";
    return `<span class="${cls}">${v > 0 ? "+" : ""}${fmt(key, v)}</span>`;
  }
  const plain = (v) => (v < 0 ? MINUS : "") + n(v, Math.abs(v) % 1 ? 1 : 0);

  // ---- Header ----
  let mode = store.get("mode", "guide");
  $("pob-chip").textContent = "PoB " + D.meta.pob;
  $("live-name").textContent = D.meta.live.name;
  const upd = new Date(D.meta.live.updated);
  $("live-sub").textContent = `Lvl ${D.meta.live.level} ${D.meta.live.ascendancy} · poe.ninja ${upd.toLocaleString("en-US", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", timeZone: "UTC" })} UTC`;
  $("loadout").innerHTML = D.meta.loadouts.map((l) => `<option${l === D.meta.guide.loadout ? " selected" : " disabled"}>${esc(l)}</option>`).join("");
  $("guide-sub").textContent = `Lvl ${D.meta.guide.level} · Guide`;
  $("skill").textContent = `${D.meta.skill.replace(/^Summon /, "")} › ${D.meta.minionSkill}`;
  $("config-chip").textContent = `${D.config.rows.length} differ`;

  // ---- Sections: fold, jump bar ----
  const sections = [...document.querySelectorAll(".section")];
  const storedFolds = store.get("folded", []);
  const folded = new Set(Array.isArray(storedFolds) ? storedFolds : []);
  const chevron = (open) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="${open ? "M6 15l6-6 6 6" : "M6 9l6 6 6-6"}"/></svg>`;
  for (const s of sections) {
    const body = s.querySelector(".body");
    if (!body.id) body.id = s.id + "-body";
    const head = document.createElement("div");
    head.className = "head";
    head.innerHTML = `<button type="button" class="toggle" aria-expanded="true" aria-controls="${body.id}" id="${s.id}-title"><span>${esc(s.dataset.title)}</span>${chevron(true)}</button><div class="actions"></div>`;
    s.prepend(head);
    s.setAttribute("aria-labelledby", s.id + "-title");
    head.addEventListener("click", (e) => { if (!e.target.closest(".actions")) toggle(s); });
    setFold(s, folded.has(s.id));
  }
  function setFold(s, fold) {
    s.toggleAttribute("data-collapsed", fold);
    const b = s.querySelector(".toggle");
    b.setAttribute("aria-expanded", String(!fold));
    b.querySelector("svg").outerHTML = chevron(!fold);
    if (fold) folded.add(s.id); else folded.delete(s.id);
    store.set("folded", [...folded]);
  }
  function toggle(s) {
    const head = s.querySelector(".head");
    const inside = s.getBoundingClientRect().top < parseFloat(getComputedStyle(head).top) - 2;
    const fold = !s.hasAttribute("data-collapsed");
    setFold(s, fold);
    if (fold && inside) (s.nextElementSibling || s).scrollIntoView({ block: "start" });
  }
  // Opens a section, scrolls to it and moves keyboard focus to its header (or `then`'s target).
  function jumpTo(id, then) {
    const s = $(id);
    setFold(s, false);
    requestAnimationFrame(() => {
      s.scrollIntoView({ behavior: "smooth", block: "start" });
      s.querySelector(".toggle").focus({ preventScroll: true });
      then?.();
    });
  }
  $("jumps").innerHTML = sections.map((s) => `<a class="jump" href="#${s.id}" data-jump="${s.id}">${esc(s.dataset.title)}</a>`).join("");
  $("jumps").addEventListener("click", (e) => {
    const a = e.target.closest("[data-jump]");
    if (!a) return;
    e.preventDefault();
    jumpTo(a.dataset.jump);
  });
  // The section you're in: the last one whose top has reached the jump bar's bottom.
  function current() {
    const bar = document.querySelector(".jumpbar").getBoundingClientRect().bottom + 12;
    let at = null;
    for (const s of sections) if (s.getBoundingClientRect().top <= bar) at = s.id;
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2) at = sections[sections.length - 1].id;
    for (const a of document.querySelectorAll("[data-jump]")) {
      const on = a.dataset.jump === at;
      if (on && a.getAttribute("aria-current") !== "true") {
        // Keep the active link visible in a jump bar that scrolls sideways (phones).
        const bar = document.querySelector(".jumpbar");
        const r = a.getBoundingClientRect(), b = bar.getBoundingClientRect();
        if (r.left < b.left || r.right > b.right) bar.scrollLeft += r.left - b.left - 8;
      }
      a.setAttribute("aria-current", String(on));
    }
  }
  addEventListener("scroll", current, { passive: true });
  addEventListener("resize", current);

  // ---- Toast ----
  let toastTimer;
  function toast(text) {
    const t = $("toast");
    t.textContent = text + " (demo)";
    t.classList.remove("off");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.add("off"), 1600);
  }
  document.addEventListener("click", (e) => { const b = e.target.closest("[data-toast]"); if (b) toast(b.dataset.toast); });

  // ---- Summary ----
  function renderTiles() {
    const you = D.values[mode], g = D.values.target;
    $("tiles").innerHTML = D.metrics.map((m) => `
      <button type="button" class="tile" data-metric="${esc(m.key)}">
        <span class="t">${esc(m.label)}</span>
        <span class="v">${fmt(m.key, you[m.key])}</span>
        <span class="g"><span>Guide ${fmt(m.key, g[m.key])}</span>${delta(m.key, you[m.key] - g[m.key], true)}</span>
      </button>`).join("");
  }
  $("tiles").addEventListener("click", (e) => {
    const t = e.target.closest("[data-metric]");
    if (!t) return;
    gapMetric = t.dataset.metric;
    renderGaps();
    jumpTo("gaps");
  });

  // ---- Gaps ----
  let gapMetric = metricKey(store.get("gap-metric", "all"), "all");
  const KIND_ORDER = ["Links", "Gems", "Gear", "Tree", "Config"];
  const visibleGaps = () => D.gaps.filter((g) => mode === "own" || g.kind !== "Config");
  function gapRow(g) {
    const keys = gapMetric === "all" ? D.metrics.map((m) => m.key) : [gapMetric];
    const pills = keys.filter((k) => Math.abs(g.d[k]) >= THRESH[k]);
    const others = gapMetric === "all" ? [] : D.metrics.map((m) => m.key).filter((k) => k !== gapMetric && Math.abs(g.d[k]) >= THRESH[k]);
    const pill = (k, big) => `<span class="pill${big ? " big" : ""}">${delta(k, g.d[k])} <span class="muted">${esc(metric[k].label)}</span></span>`;
    const target = g.target || "";
    const trade = g.kind === "Gear" ? `<button type="button" class="btn" data-toast="Trade search">Trade</button>` : "";
    return `<div class="gap">
      <span class="kind ${esc(g.kind)}">${esc(g.kind)}</span>
      <div class="what"><b>${esc(g.title)}</b> <span class="d">${esc(g.detail)}</span></div>
      <div class="act"><button type="button" class="btn" data-show="${esc(target)}">Show</button>${trade}</div>
      <div class="pills">${pills.map((k) => pill(k, gapMetric !== "all")).join("")}${others.map((k) => pill(k, false)).join("")}</div>
    </div>`;
  }
  function renderGaps() {
    store.set("gap-metric", gapMetric);
    const chips = [{ key: "all", label: "All" }, ...D.metrics];
    $("gap-chips").innerHTML = chips.map((c) => `<button type="button" data-gm="${esc(c.key)}" aria-pressed="${c.key === gapMetric}">${esc(c.label)}</button>`).join("");
    const list = visibleGaps();
    let html = "";
    if (gapMetric === "all") {
      for (const kind of KIND_ORDER) {
        const rows = list.filter((g) => g.kind === kind && D.metrics.some((m) => Math.abs(g.d[m.key]) >= THRESH[m.key]))
          .sort((a, b) => b.d.dps - a.d.dps);
        if (rows.length) html += `<div class="gap-head">${esc(kind)}</div>` + rows.map(gapRow).join("");
      }
    } else {
      const rows = list.filter((g) => Math.abs(g.d[gapMetric]) >= THRESH[gapMetric]);
      const gains = rows.filter((g) => g.d[gapMetric] > 0).sort((a, b) => b.d[gapMetric] - a.d[gapMetric]);
      const costs = rows.filter((g) => g.d[gapMetric] < 0).sort((a, b) => a.d[gapMetric] - b.d[gapMetric]);
      if (gains.length) html += `<div class="gap-head">Gains</div>` + gains.map(gapRow).join("");
      if (costs.length) html += `<div class="gap-head">Losses</div>` + costs.map(gapRow).join("");
    }
    $("gap-list").innerHTML = html || `<div class="empty">No gaps</div>`;
    const actions = $("gaps").querySelector(".actions");
    actions.innerHTML = `<span class="chip">Guide config</span>`;
  }
  $("gap-chips").addEventListener("click", (e) => {
    const b = e.target.closest("[data-gm]");
    if (!b) return;
    gapMetric = b.dataset.gm;
    renderGaps();
    $("gap-chips").querySelector(`[data-gm="${gapMetric}"]`)?.focus();
  });
  $("gap-list").addEventListener("click", (e) => {
    const b = e.target.closest("[data-show]");
    if (!b) return;
    const t = b.dataset.show;
    if (t.startsWith("item:")) return showItem(t.slice(5));
    jumpTo(t);
  });

  // ---- Stats ----
  let openWhy = null;
  function whyHtml(key) {
    const w = D.why[mode][key];
    const unit = (b) => (b.unit === "%" ? "%" : "");
    let f = "";
    const [a, b] = w.formula;
    // Sum-type stats (resists, chances) list their parts when there are few.
    const parts = (side) => w.blocks[0].rows.map((r) => r[side]).filter((v) => v != null && v !== 0);
    const line = (x, side) => {
      if (x.flat != null) return `${n(x.flat)} × (1 + ${plain(x.inc)}%)${x.more !== 1 ? ` × ${x.more.toFixed(2)}` : ""} = <b>${n(x.total)}</b>`;
      const p = parts(side);
      const sum = p.length > 1 && p.length <= 4
        ? p.map((v, i) => (i === 0 ? plain(v) : v < 0 ? ` ${MINUS} ${n(v)}` : ` + ${n(v)}`)).join("") + "%"
        : `${plain(x.sum)}%`;
      return x.sum > x.cap ? `${sum} · cap ${x.cap}% = <b>${plain(x.total)}%</b>` : p.length > 1 && p.length <= 4 ? `${sum} = <b>${plain(x.total)}%</b>` : `<b>${plain(x.total)}%</b>`;
    };
    f = `<div class="formula"><span class="who">Live</span><span>${line(a, "yours")}</span><span class="who">Guide</span><span>${line(b, "guide")}</span></div>`;
    const blocks = w.blocks.map((blk) => {
      const rows = blk.rows.map((r) => {
        const d = (r.yours ?? 0) - (r.guide ?? 0);
        const det = r.yoursDetail || r.guideDetail;
        const same = r.yours === r.guide;
        return `<tr${same ? ' class="same"' : ""}><td class="src"><span class="k-${esc(r.group)}">${esc(r.group)}</span> · ${esc(r.key)}${det ? `<small>${esc(r.yoursDetail && r.guideDetail && r.yoursDetail !== r.guideDetail ? r.yoursDetail + " / " + r.guideDetail : det)}</small>` : ""}</td>
          <td class="r">${r.yours == null ? "—" : plain(r.yours) + unit(blk)}</td><td class="r">${r.guide == null ? "—" : plain(r.guide) + unit(blk)}</td>
          <td class="r">${same ? '<span class="zero">0</span>' : `<span class="${d > 0 ? "pos" : "neg"}">${d > 0 ? "+" : ""}${plain(d)}${unit(blk)}</span>`}</td></tr>`;
      }).join("");
      const ta = blk.rows.reduce((s, r) => s + (r.yours ?? 0), 0), tb = blk.rows.reduce((s, r) => s + (r.guide ?? 0), 0);
      return `<div class="scroll"><table><thead><tr><th>${esc(blk.title)}</th><th class="r">Live</th><th class="r">Guide</th><th class="r">Diff</th></tr></thead>
        <tbody>${rows}<tr class="group"><td>Total</td><td class="r">${plain(ta)}${unit(blk)}</td><td class="r">${plain(tb)}${unit(blk)}</td><td class="r">${ta === tb ? "0" : (ta > tb ? "+" : "") + plain(ta - tb) + unit(blk)}</td></tr></tbody></table></div>`;
    }).join("");
    return `<div class="why" role="region" aria-label="Sources">${f}${blocks}</div>`;
  }
  function renderStats() {
    const q = $("stat-search").value.trim().toLowerCase();
    const same = $("stat-same").checked;
    const rows = D.stats[mode].filter((r) => (same || r.yours !== r.guide) && (!q || r.label.toLowerCase().includes(q)));
    let html = "", section = "";
    for (const r of rows) {
      if (r.section !== section) { section = r.section; html += `<tr class="group"><td colspan="5">${esc(section)}</td></tr>`; }
      const d = r.diff;
      const diff = d == null ? "" : Math.abs(d) < 0.005 ? '<span class="zero">0</span>' : `<span class="${d > 0 ? "pos" : "neg"}">${d > 0 ? "+" : MINUS}${n(d, Math.abs(d) % 1 ? (Math.abs(d) < 10 ? 2 : 1) : 0)}</span>`;
      const open = openWhy === r.why && r.why;
      const whyBtn = r.why ? `<button type="button" class="btn" data-why="${esc(r.why)}" aria-expanded="${!!open}">Why</button>` : "";
      html += `<tr class="${r.yours === r.guide ? "same" : ""}${open ? " open" : ""}"><td>${esc(r.label)}${r.calcs ? '<span class="tag">CALCS</span>' : ""}</td><td class="r">${esc(r.yours ?? "—")}</td><td class="r">${esc(r.guide ?? "—")}</td><td class="r">${diff}</td><td class="r">${whyBtn}</td></tr>`;
      if (open) html += `<tr><td colspan="5" class="drawer">${whyHtml(r.why)}</td></tr>`;
    }
    $("stat-body").innerHTML = html || `<tr><td colspan="5" class="empty">${q ? "No matches" : "No differences"}</td></tr>`;
    $("stats").querySelector(".actions").innerHTML = `<span class="chip">${mode === "guide" ? "Guide config" : "Live config"}</span>`;
  }
  $("stat-search").addEventListener("input", renderStats);
  $("stat-same").addEventListener("change", renderStats);
  $("stat-body").addEventListener("click", (e) => {
    const b = e.target.closest("[data-why]");
    if (!b) return;
    openWhy = openWhy === b.dataset.why ? null : b.dataset.why;
    renderStats();
    $("stat-body").querySelector(`[data-why="${b.dataset.why}"]`)?.focus();
  });

  // ---- Config ----
  function renderConfig() {
    const c = D.config;
    const rows = c.rows.map((r) => `<tr><td>${esc(r.label)}</td><td>${esc(r.yours ?? "—")}</td><td>${esc(r.guide ?? "—")}</td></tr>`).join("");
    const mods = (list) => list.length ? `<ul style="margin:0;padding-left:18px">${list.map((m) => `<li>${esc(m)}</li>`).join("")}</ul>` : `<span class="muted">None</span>`;
    $("config-body").innerHTML = `
      <div class="scroll"><table><thead><tr><th>Setting</th><th>Live</th><th>Guide</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="scroll"><table><thead><tr><th>Mods · Live</th><th>Mods · Guide</th></tr></thead>
        <tbody><tr><td style="vertical-align:top">${mods(c.modsYours)}</td><td style="vertical-align:top">${mods(c.modsGuide)}</td></tr></tbody></table></div>`;
    $("config").querySelector(".actions").innerHTML = `<span class="chip">${esc(c.guideTitle)}</span>`;
  }

  // ---- Passives ----
  function renderPassives() {
    const p = D.passives;
    let html = "", kind = "";
    for (const r of p.list) {
      if (r.kind !== kind) { kind = r.kind; html += `<tr class="group"><td colspan="4">${esc(kind)}</td></tr>`; }
      const d = r.yours - r.guide;
      html += `<tr><td>${esc(r.name)}${r.effect ? `<div class="muted" style="font-size:12px">${esc(r.effect)}</div>` : ""}</td><td class="r">${r.yours || "—"}</td><td class="r">${r.guide || "—"}</td><td class="r"><span class="${d > 0 ? "pos" : "neg"}">${d > 0 ? "+" : MINUS}${Math.abs(d)}</span></td></tr>`;
    }
    $("passive-body").innerHTML = `<div class="scroll"><table><thead><tr><th>Passive</th><th class="r">Live</th><th class="r">Guide</th><th class="r">Diff</th></tr></thead><tbody>${html}</tbody></table></div>`;
    $("passives").querySelector(".actions").innerHTML = `<span class="chip">${p.yours} vs ${p.guide} points</span>`;
  }

  // ---- Skills ----
  function renderSkills() {
    $("skill-body").innerHTML = D.skills.map((s) => {
      const names = [...new Set([...(s.guide?.gems ?? []).map((g) => g.name), ...(s.yours?.gems ?? []).map((g) => g.name)])];
      const find = (grp, name) => grp?.gems.find((g) => g.name === name);
      const lvl = (g) => (g ? `${g.level}${g.quality ? "/" + g.quality : ""}` : "—");
      const rows = names.map((name) => {
        const y = find(s.yours, name), g = find(s.guide, name);
        const cls = !y ? "miss" : !g ? "extra" : y.level < g.level ? "neg" : "";
        return `<tr><td class="${!y ? "miss" : !g ? "extra" : ""}">${esc(name)}</td><td class="r ${cls}">${lvl(y)}</td><td class="r">${lvl(g)}</td></tr>`;
      }).join("");
      const ys = s.yours?.slot ?? "—", gs = s.guide?.slot ?? "—";
      const slots = ys === gs ? esc(ys) : `${esc(ys)} / ${esc(gs)}`;
      return `<div class="grp"><h3>${esc(s.name)}</h3><div class="slots">Slot: ${slots}</div>
        <table><thead><tr><th>Gem</th><th class="r">Live</th><th class="r">Guide</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }).join("");
  }

  // ---- Items ----
  const rarity = (it) => (it ? String(it.rarity || "normal").toLowerCase() : "normal");
  const itemName = (it) => (it ? `<span class="${rarity(it)}">${esc(it.name || it.base)}</span>${it.name ? ` <small>${esc(it.base)}</small>` : ""}` : `<span class="muted">Empty</span>`);
  function renderItems() {
    $("item-body").innerHTML = D.items.map((d) => {
      const list = (l) => l.length ? `<ul>${l.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>` : `<span class="muted">None</span>`;
      const rolls = d.rolls.length ? `<div class="rolls"><h4>Rolls</h4><ul>${d.rolls.map(([a, b]) => `<li>${esc(a)} <span class="muted">→</span> ${esc(b)}</li>`).join("")}</ul></div>` : "";
      return `<details class="item" id="item-${d.slot.replace(/\W+/g, "-")}">
        <summary><span class="slot">${esc(d.slot)}</span><span class="nm">${itemName(d.yours)}</span><span class="nm">${itemName(d.guide)}</span></summary>
        <div class="lines"><div><h4>Live only</h4>${list(d.onlyYours)}</div><div><h4>Guide only</h4>${list(d.onlyGuide)}</div>${rolls}</div>
      </details>`;
    }).join("");
    $("items").querySelector(".actions").innerHTML = `<span class="chip">Live vs Guide</span>`;
  }
  function showItem(slot) {
    const el = $("item-" + slot.replace(/\W+/g, "-")) || $("item-" + (slot + " Abyssal Socket 1").replace(/\W+/g, "-"));
    jumpTo("items", () => {
      if (!el) return;
      el.open = true;
      el.querySelector("summary").focus({ preventScroll: true });
      el.classList.add("flash");
      setTimeout(() => el.scrollIntoView({ behavior: "smooth", block: "center" }), 250);
      setTimeout(() => el.classList.remove("flash"), 2200);
    });
  }

  // ---- Overlay ----
  let ovMetric = metricKey(store.get("ov-metric", "dps"), "dps");
  if (ovMetric === "all") ovMetric = "dps";
  function renderOverlay() {
    store.set("ov-metric", ovMetric);
    $("ov-chips").innerHTML = D.metrics.slice(0, 4).map((m) => `<button type="button" data-ov="${esc(m.key)}" aria-pressed="${m.key === ovMetric}">${esc(m.label)}</button>`).join("");
    const top = D.gaps.filter((g) => g.kind !== "Config" && g.d[ovMetric] >= THRESH[ovMetric]).sort((a, b) => b.d[ovMetric] - a.d[ovMetric]).slice(0, 3);
    $("ov").innerHTML = `<div class="h">Gaps<span class="sub">${esc(D.meta.guide.loadout)}</span></div>
      ${top.map((g) => `<div class="r"><span>${esc(g.title)}</span>${delta(ovMetric, g.d[ovMetric])}</div>`).join("") || `<div class="muted">No gaps</div>`}
      <div class="r"><span class="muted">${esc(metric[ovMetric].label)}</span><button type="button" class="btn" data-ov-open>Compare</button></div>`;
  }
  $("ov-chips").addEventListener("click", (e) => {
    const b = e.target.closest("[data-ov]");
    if (!b) return;
    ovMetric = b.dataset.ov;
    renderOverlay();
    $("ov-chips").querySelector(`[data-ov="${ovMetric}"]`)?.focus();
  });
  $("ov").addEventListener("click", (e) => {
    if (!e.target.closest("[data-ov-open]")) return;
    gapMetric = ovMetric;
    renderGaps();
    jumpTo("gaps");
  });

  // ---- Config mode ----
  function setMode(m) {
    mode = m;
    store.set("mode", m);
    for (const b of document.querySelectorAll("[data-mode]")) b.setAttribute("aria-pressed", String(b.dataset.mode === m));
    renderTiles();
    renderGaps();
    renderStats();
  }
  document.querySelector(".seg").addEventListener("click", (e) => { const b = e.target.closest("[data-mode]"); if (b) setMode(b.dataset.mode); });

  renderConfig();
  renderPassives();
  renderSkills();
  renderItems();
  renderOverlay();
  setMode(mode === "own" ? "own" : "guide");
  current();
})();
</script>
</body>
</html>
