name: Desktop exe

# Builds exile-leveling.exe: the guide plus the log watcher in one program.
# Run it from the Actions tab, or push a tag like v1.0.0 to attach the exe to a release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # One command per step: a pwsh step only fails on its last command's exit code.
      - name: Install packages
        run: npm ci

      - name: Download skill tree data
        run: npm -w seeding run seed tree

      - name: Build the guide
        run: npm -w web run build:desktop

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: log-api

      - name: Test
        working-directory: log-api
        run: cargo test

      - name: Build the exe
        working-directory: log-api
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: exile-leveling-windows
          path: log-api/target/release/exile-leveling.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: log-api/target/release/exile-leveling.exe
