name: Desktop exe

# Builds lioneye.exe: the guide plus the log watcher in one program. (Cargo builds it as
# exile-leveling.exe, the name before 0.4; the "Name the exe" step renames it.)
# Run it from the Actions tab, or push a tag like v1.0.0 to attach lioneye.zip to a release.
# Actions are pinned to commit SHAs so a moved tag can't change what runs.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      # One command per step: a pwsh step only fails on its last command's exit code.
      - name: Install packages
        run: npm ci

      - name: Download skill tree data
        run: npm -w seeding run seed tree

      - name: Build the guide
        run: npm -w web run build:desktop

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: log-api

      - name: Test
        working-directory: log-api
        run: cargo test

      - name: Build the exe
        working-directory: log-api
        run: cargo build --release

      - name: Name the exe
        run: Copy-Item log-api/target/release/exile-leveling.exe lioneye.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lioneye-windows
          path: lioneye.exe

  # Only this job can write to the repo, and it runs no build code.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lioneye-windows

      # Zipped: browsers warn less about a zip than a bare unsigned exe. Same name every
      # release, so releases/latest/download/lioneye.zip always gets the newest.
      - name: Zip the exe
        run: zip -j lioneye.zip lioneye.exe

      - name: Attach to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: lioneye.zip
